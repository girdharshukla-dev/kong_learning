_format_version: "3.0"

services:
  - name: "starlette_backend"
    url: "http://host.docker.internal:8080"
    routes:
      - name: "test-routes"
        paths:
          - /hello
          - /ping
          - /slow
        strip_path: false

      - name: "users-routes"
        paths:
          - /users
          - ~/users/(?<user_id>[0-9]+)$
        strip_path: false

consumers:
  - custom_id: example_consumer_id
    username: example_consumer
    keyauth_credentials:
      - key: abc123


plugins:
  - name: rate-limiting
    route: test-routes
    config:
      hour: 10
      policy: local
      limit_by: ip
      
  - name: key-auth
    route: test-routes
    config:
      key_names:
      - api_key